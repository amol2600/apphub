{% extends "base.html" %}

{% block title %}
Edit Transaction
{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header d-flex justify-content-between align-items-center">

                    <div>

                        <h3 class="mb-1">
                            Edit Transaction
                        </h3>

                        <small class="text-muted">
                            Update your transaction details.
                        </small>

                    </div>

                    <a
                        href="{% url 'transaction_list' %}"
                        class="btn btn-outline-secondary"
                    >
                        Back
                    </a>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Title -->

                        <div class="mb-3">

                            <label class="form-label fw-semibold">

                                Title
                                <span class="text-danger">*</span>

                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ transaction.title }}"
                                placeholder="Enter transaction title"
                                required
                            >

                        </div>

                        <div class="row">

                            <!-- Amount -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">

                                    Amount
                                    <span class="text-danger">*</span>

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        ₹

                                    </span>

                                    <input
                                        type="number"
                                        name="amount"
                                        class="form-control"
                                        step="0.01"
                                        value="{{ transaction.amount }}"
                                        placeholder="0.00"
                                        required
                                    >

                                </div>

                            </div>

                            <!-- Transaction Type -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">

                                    Transaction Type
                                    <span class="text-danger">*</span>

                                </label>

                                <select
                                    name="transaction_type"
                                    class="form-select"
                                    required
                                >

                                    <option
                                        value="Income"
                                        {% if transaction.transaction_type == "Income" %}
                                            selected
                                        {% endif %}
                                    >
                                        Income
                                    </option>

                                    <option
                                        value="Expense"
                                        {% if transaction.transaction_type == "Expense" %}
                                            selected
                                        {% endif %}
                                    >
                                        Expense
                                    </option>

                                </select>

                            </div>

                        </div>

                        <div class="row">

                            <!-- Category -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">

                                    Category
                                    <span class="text-danger">*</span>

                                </label>

                                <select
                                    name="category"
                                    class="form-select"
                                    required
                                >

                                    {% for category in categories %}

                                    <option
                                        value="{{ category.id }}"
                                        {% if category.id == transaction.category.id %}
                                            selected
                                        {% endif %}
                                    >

                                        {{ category.name }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </div>

                            <!-- Transaction Date -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">

                                    Transaction Date
                                    <span class="text-danger">*</span>

                                </label>

                                <input
                                    type="date"
                                    name="transaction_date"
                                    class="form-control"
                                    value="{{ transaction.transaction_date|date:'Y-m-d' }}"
                                    required
                                >

                            </div>

                        </div>

                        <!-- Description -->

                        <div class="mb-4">

                            <label class="form-label fw-semibold">

                                Description

                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Add any additional details (optional)"
                            >{{ transaction.description }}</textarea>

                        </div>

                        <hr>

                        <!-- Buttons -->

                        <div class="d-flex justify-content-end gap-2">

                            <a
                                href="{% url 'transaction_list' %}"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="reset"
                                class="btn btn-outline-warning"
                            >
                                Reset
                            </button>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Update Transaction
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
